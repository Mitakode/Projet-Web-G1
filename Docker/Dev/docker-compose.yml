services:
  web:
    image: lamp-projet-web:latest
    container_name: mon_lamp_dev
    ports:
      - "8080:80"
    volumes:
      - ./config/www:/var/www/html
      - ./config/mon-site.conf:/etc/apache2/sites-enabled/careerquest.conf
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    container_name: mon_mysql
    environment:
      MYSQL_DATABASE: projet_db
      MYSQL_USER: projet_user
      MYSQL_PASSWORD: projet_pass
      MYSQL_ROOT_PASSWORD: root_pass
    volumes:
      - ./config/db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -proot_pass || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: mon_phpmyadmin
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    depends_on:
      db:
        condition: service_healthy
