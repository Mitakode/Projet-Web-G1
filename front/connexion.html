<!DOCTYPE html>
<html lang="fr">
    <head>
    <meta charset="utf-8">
    <title>Career Quest</title>
	<meta name="description" content="Venez rechercher la perle rare parmi nos offres d'emploi.">
	<link href="main-stylesheet.css" rel="stylesheet" />
    <link href="connexion-stylesheet.css" rel="stylesheet" />
    </head>

    <body>
        <header class="navbar">
            <div class="logo">
        <img src="images/logo.png" alt="Logo de Career Quest"/>
        </div>

        <div class="search-container">
            <input type="text" placeholder="Rechercher" class="search-bar"/>
        </div>

        <div class="account">
            <div class="user-icon">
                <img src="images/user_icon.svg" alt="Icône de compte utilisateur"/>
            </div>
            <span class="account-text">Mon compte</span>

        </div>
        </header>
        <section>
          <div class="auth-container">
          
			      <div class="auth-box">
			        <h1>Connexion</h1>
			        <form>
			          <label>Adresse email</label>
			          <input type="email">
              
			          <label>Mot de passe</label>
			          <input type="password">
              
			          <div class="checkbox-group">
			            <input type="checkbox"> <span>Rester connecté</span>
			          </div>
              
			          <a href="#" class="forgot-pwd">Mot de passe oublié ?</a>
			          <button type="submit" class="btn">Connexion</button>
			        </form>
			      </div>
          
			      <div class="vertical-divider"></div>
          
			      <div class="auth-box">
			        <h1>Inscription</h1>
			        <form>
			          <label>Adresse email</label>
			          <input type="email">
              
			          <label>Mot de passe</label>
			          <input type="password">
              
			          <label>Confirmer le mot de passe</label>
			          <input type="password">
              
			          <div class="checkbox-group">
			            <input type="checkbox"> <span>Accepter les conditions générales d'utilisation</span>
			          </div>

                      <div class="checkbox-group">
			            <input type="checkbox"> <span>Rester connecté</span>
			          </div>
              
			          <button type="submit" class="btn">Créer le compte</button>
			        </form>
			      </div>
			    </div>
        </section>

        <footer class="site-footer">
            <p>
            © Career Quest | 
            <a href="page-mentions-legales.html" class="footer-link">Mentions Légales</a>
            </p>
        </footer>
    
    </body>

</html>
