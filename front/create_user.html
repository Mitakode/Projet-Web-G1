<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <title>Career Quest | Creer un utilisateur</title>
    <meta name="description" content="Venez rechercher la perle rare parmi nos offres d'emploi.">
    <link href="main-stylesheet.css" rel="stylesheet"/>
    <link href="user_form_style.css" rel="stylesheet"/>
</head>

<body>
<header class="navbar">
    <div class="logo">
        <img src="images/logo.png" alt="Logo de Career Quest"/>
    </div>

    <div class="search-container">
        <input type="text" placeholder="Rechercher" class="search-bar"/>
    </div>

    <div class="account">
        <div class="user-icon">
            <img src="images/user_icon.svg" alt="Icône de compte utilisateur"/>
        </div>
        <span class="account-text">Mon compte</span>
    </div>
</header>

<main>
    <h1 class="create-user-title">Creer un utilisateur</h1>
    <form action="" method="POST" class="create-user-form">
        <div>
            <label for="nom">Nom</label>
            <input type="text" id="nom" name="nom" required/>
        </div>
        <div>
            <label for="prenom">Prenom</label>
            <input type="text" id="prenom" name="prenom" required/>
        </div>
        <div>
            <label for="date">Date</label>
            <input type="date" id="date" name="date" required/>
        </div>
        <div>
            <label for="formation">Formation</label>
            <input type="text" id="formation" name="formation" required/>
        </div>
        <div>
            <label for="mail">Mail</label>
            <input type="email" id="mail" name="mail" required/>
        </div>
        <div>
            <label for="mot-de-passe">Mot de passe</label>
            <input type="password" id="mot-de-passe" name="mot_de_passe" required/>
        </div>
        <div>
            <label for="role">Role</label>
            <select id="role" name="role" required>
                <option value="" disabled selected>Choisir un role</option>
                <option value="eleve">Eleve</option>
                <option value="pilote">Pilote</option>
                <option value="administrateur">Administrateur</option>
            </select>
        </div>
        <div>
            <label for="photo-profil">Photo de profil</label>
            <input type="file" id="photo-profil" name="photo_profil" accept="image/*"/>
        </div>
        <div>
            <label for="description">Description</label>
            <textarea id="description" name="description" rows="4" required></textarea>
        </div>
        <div>
            <button type="submit">Envoyer</button>
        </div>
    </form>
</main>

<footer class="site-footer">
    <p>
        © Career Quest |
        <a href="page-mentions-legales.html" class="footer-link">Mentions Légales</a>
    </p>
</footer>

</body>

</html>
